# =============================================================================
# 预上线环境配置 (Staging)
# 仅覆盖与基础配置不同的部分
# =============================================================================

server:
  reload: false
  workers: 2
  log_level: "info"

app:
  debug: false
  secret_key: "${WIZYELAB_APP_SECRET_KEY}"

# =============================================================================
# 数据库配置 - 预上线环境
# =============================================================================
database:
  host: "pc-uf6q6w8i03g6g21v6.rwlb.rds.aliyuncs.com"
  user: "wizzy_root"
  password: "${WIZYELAB_DATABASE_PASSWORD}"
  database: "wizyelab_dev"
  echo: true  # 开发环境打印 SQL

# =============================================================================
# Redis 配置 - 开发环境
# =============================================================================
redis:
  host: "redis-wizzy-test1.redis.rds.aliyuncs.com"
  username: "wizzy_test_redis"
  password: "${WIZYELAB_REDIS_PASSWORD}"

# =============================================================================
# LLM 配置 - 预上线环境
# =============================================================================
llm:
  api_key: "${WIZYELAB_LLM_API_KEY}"
  langsmith_project: "wizyelab-agent-staging"
  langsmith_tracing: true

# =============================================================================
# Agent 配置 - 预上线环境
# =============================================================================
agent:
  verbose: false

# =============================================================================
# 日志配置 - 预上线环境
# =============================================================================
logging:
  level: "INFO"
  json_format: true
  log_to_file: true
  log_file_path: "logs/staging.log"

# =============================================================================
# 监控配置 - 预上线环境
# =============================================================================
monitoring:
  tracing:
    enabled: true
    service_name: "wizyelab-web-start-staging"
    sample_rate: 0.5
  health_check:
    include_details: true

# =============================================================================
# 限流配置 - 预上线环境（比生产宽松）
# =============================================================================
rate_limit:
  enabled: true
  default_limit: 120
  api_limits:
    chat: 60
    open: 200
    internal: 400

# =============================================================================
# 缓存配置 - 预上线环境
# =============================================================================
cache:
  redis:
    prefix: "wizyelab:staging:cache:"
    default_ttl: 1800

# =============================================================================
# CORS 配置 - 预上线环境（限制来源）
# =============================================================================
cors:
  allow_origins:
    - "https://staging.wizyelab.com"
    - "https://staging-admin.wizyelab.com"

# =============================================================================
# OSS 配置 - 预上线环境
# =============================================================================
oss:
  access_key_id: "${WIZYELAB_OSS_ACCESS_KEY_ID}"
  access_key_secret: "${WIZYELAB_OSS_ACCESS_KEY_SECRET}"
  endpoint: "oss-cn-shanghai-internal.aliyuncs.com"
  bucket_name: "oss-wizzy-test"
  region: "cn-shanghai"
