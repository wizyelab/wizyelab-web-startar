# =============================================================================
# 开发环境配置 (Development)
# 仅覆盖与基础配置不同的部分
# =============================================================================

server:
  reload: true
  workers: 1
  log_level: "debug"

app:
  debug: true
  secret_key: "dev-secret-key-not-for-production"

# =============================================================================
# 数据库配置 - 开发环境
# =============================================================================
database:
  host: "pc-6we8a02aqzv962ml0.rwlb.japan.rds.aliyuncs.com"
  #host: "shanghai-public.rwlb.rds.aliyuncs.com"
  user: "wizzy_root"
  password: "${WIZYELAB_DATABASE_PASSWORD}"
  database: "wizyelab_dev"
  echo: false  # 关闭 SQL 日志

# =============================================================================
# Redis 配置 - 开发环境
# =============================================================================
redis:
  host: "redis-wizye-test1.redis.japan.rds.aliyuncs.com"
  #host: "shanghai-public.redis.rds.aliyuncs.com"
  username: "wizzy_test_redis"
  password: "${WIZYELAB_REDIS_PASSWORD}"

# =============================================================================
# LLM 配置 - 开发环境
# =============================================================================
llm:
  langsmith_project: "${APP_PROJECT_NAME}-agent-dev"
  langsmith_tracing: true

# =============================================================================
# Agent 配置 - 开发环境
# =============================================================================
agent:
  verbose: true

# =============================================================================
# 日志配置 - 开发环境
# =============================================================================
logging:
  level: "DEBUG"
  json_format: false  # 开发环境使用普通格式便于阅读

# =============================================================================
# 监控配置 - 开发环境
# =============================================================================
monitoring:
  tracing:
    enabled: true
    service_name: "${APP_PROJECT_NAME}-web-start-dev"
  health_check:
    include_details: true

# =============================================================================
# 缓存配置 - 开发环境
# =============================================================================
cache:
  redis:
    prefix: "${APP_PROJECT_NAME}:dev:cache:"
    default_ttl: 300  # 开发环境缓存时间短一些

# =============================================================================
# CORS 配置 - 开发环境（允许所有来源）
# =============================================================================
cors:
  allow_origins:
    - "*"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

# =============================================================================
# OSS 配置 - 开发环境
# =============================================================================
oss:
  access_key_id: "${WIZYELAB_OSS_ACCESS_KEY_ID}"
  access_key_secret: "${WIZYELAB_OSS_ACCESS_KEY_SECRET}"
  endpoint: "oss-ap-northeast-1.aliyuncs.com"
  internal_endpoint: "oss-ap-northeast-1.aliyuncs.com"
  bucket_name: "oss-wizyelab-test"
  region: "ap-northeast-1"
  file_host: "image.wizzyspot.com"

# =============================================================================
# Firebase 配置 - 开发环境
# =============================================================================
firebase:
  project_id: "${FIREBASE_PROJECT_ID}"
  credentials_path: "${FIREBASE_CREDENTIALS_PATH}"

# =============================================================================
# SMTP 配置 - 开发环境
# =============================================================================
smtp:
  host: "${SMTP_HOST}"
  port: 587
  user: "${SMTP_USER}"
  password: "${SMTP_PASSWORD}"
  from_email: "${SMTP_FROM_EMAIL}"
  from_name: "${APP_PROJECT_DISPLAY_NAME}"
  use_tls: true
