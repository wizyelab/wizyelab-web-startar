# =============================================================================
# 开发环境配置 (Development)
# 仅覆盖与基础配置不同的部分
# =============================================================================

server:
  reload: true
  workers: 1
  log_level: "debug"

app:
  debug: true
  secret_key: "dev-secret-key-not-for-production"

# =============================================================================
# 数据库配置 - 开发环境
# =============================================================================
database:
  host: "pc-uf6q6w8i03g6g21v6.rwlb.rds.aliyuncs.com"
  user: "wizzy_root"
  password: "${WIZYELAB_DATABASE_PASSWORD}"
  database: "wizyelab_dev"
  echo: true  # 开发环境打印 SQL

# =============================================================================
# Redis 配置 - 开发环境
# =============================================================================
redis:
  host: "redis-wizzy-test1.redis.rds.aliyuncs.com"
  username: "wizzy_test_redis"
  password: "${WIZYELAB_REDIS_PASSWORD}"

# =============================================================================
# LLM 配置 - 开发环境
# =============================================================================
llm:
  langsmith_project: "wizyelab-agent-dev"
  langsmith_tracing: true

# =============================================================================
# Agent 配置 - 开发环境
# =============================================================================
agent:
  verbose: true

# =============================================================================
# 日志配置 - 开发环境
# =============================================================================
logging:
  level: "DEBUG"
  json_format: false  # 开发环境使用普通格式便于阅读

# =============================================================================
# 监控配置 - 开发环境
# =============================================================================
monitoring:
  tracing:
    enabled: true
    service_name: "wizyelab-web-start-dev"
  health_check:
    include_details: true

# =============================================================================
# 缓存配置 - 开发环境
# =============================================================================
cache:
  redis:
    prefix: "wizyelab:dev:cache:"
    default_ttl: 300  # 开发环境缓存时间短一些

# =============================================================================
# CORS 配置 - 开发环境（允许所有来源）
# =============================================================================
cors:
  allow_origins:
    - "*"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

# =============================================================================
# OSS 配置 - 开发环境
# =============================================================================
oss:
  access_key_id: "${WIZYELAB_OSS_ACCESS_KEY_ID}"
  access_key_secret: "${WIZYELAB_OSS_ACCESS_KEY_SECRET}"
  endpoint: "oss-cn-shanghai-internal.aliyuncs.com"
  bucket_name: "oss-wizzy-test"
  region: "cn-shanghai"
